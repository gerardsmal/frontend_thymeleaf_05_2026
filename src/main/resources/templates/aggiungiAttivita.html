<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" >
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
	<nav th:insert="~{fragments/navigation :: block-navigation('Aggiungere un attività')}"></nav>
	<div class="contaiiner mt-3" align="center">
		<div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
		
		<form class="form-content" th:action=@{saveAbbonamentoAttivita} th:object=${param}
			method="post" style="width: 50%; margin:auto;">
		
			<select class="form-select" th:field="*{attivitaId}">
				<option value="" selected>Selezionare un attività</option>
				<option th:each="att : ${listAttivita}"
					th:value="${att.id}"
					th:text="${att.descrizione}"></option>			
			</select>
		
			<input type="hidden" th:field="*{id}">
			<input type="hidden" th:field="*{socioId}">
		
			<div align="center">
				<button type="submit" class="btn btn-info mt-2">Aggiungi attività</button>
			</div>
		</form>
	</div>

</body>
</html>
